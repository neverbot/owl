{{define "layout"}}<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>{{.Title}} · owl docs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="owl-docs-base" content="{{.BaseURL}}">
<link rel="icon" type="image/svg+xml" href="{{base "/favicon.svg"}}">
<link rel="icon" type="image/png" sizes="32x32" href="{{base "/favicon-32.png"}}">
<link rel="icon" type="image/png" sizes="16x16" href="{{base "/favicon-16.png"}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{base "/apple-touch-icon.png"}}">
<link rel="stylesheet" href="{{base "/static/owl.css"}}">
<link rel="stylesheet" href="{{base "/static/docs.css"}}">
<script>
  (function () {
    var saved = localStorage.getItem("owl-theme");
    var prefersDark = window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = saved || (prefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<div class="docs-shell">
  {{template "topbar" .}}
</div>
<div class="docs">
  {{template "sidenav" .}}
  <main class="docs__main">
    <article class="docs__article">
      {{.BodyHTML}}
    </article>
  </main>
</div>
<script src="{{base "/static/app.js"}}"></script>
<script src="{{base "/static/search.js"}}" defer></script>
</body>
</html>
{{end}}
