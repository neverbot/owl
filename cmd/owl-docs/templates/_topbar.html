{{define "topbar"}}
<nav class="topbar">
  <a class="topbar__brand" href="{{base "/"}}">
    <svg class="topbar__mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 9 L7 6 L11 9"/>
      <path d="M25 9 L25 6 L21 9"/>
      <circle cx="11" cy="16" r="5"/>
      <circle cx="21" cy="16" r="5"/>
      <circle cx="11" cy="16" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="21" cy="16" r="1.4" fill="currentColor" stroke="none"/>
      <path d="M16 20.5 L14.2 24 L17.8 24 Z" fill="currentColor" stroke="none"/>
    </svg>
    owl<span class="topbar__suffix">docs</span>
  </a>
  <div class="topbar__crumbs">
    {{if .Section}}<span class="topbar__crumb-section">{{.Section}}</span><span class="sep">·</span>{{end}}
    <span class="current">{{.Title}}</span>
  </div>
  <form class="search" role="search" data-search>
    <input type="search" placeholder="Search docs…" aria-label="Search"
           data-search-input autocomplete="off" spellcheck="false">
    <div class="search__results" data-search-results hidden></div>
  </form>
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle colour theme" type="button">
    <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.25"></circle>
      <g stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
        <line x1="8" y1="1.5" x2="8" y2="3"></line>
        <line x1="8" y1="13" x2="8" y2="14.5"></line>
        <line x1="1.5" y1="8" x2="3" y2="8"></line>
        <line x1="13" y1="8" x2="14.5" y2="8"></line>
        <line x1="3.3" y1="3.3" x2="4.4" y2="4.4"></line>
        <line x1="11.6" y1="11.6" x2="12.7" y2="12.7"></line>
        <line x1="3.3" y1="12.7" x2="4.4" y2="11.6"></line>
        <line x1="11.6" y1="4.4" x2="12.7" y2="3.3"></line>
      </g>
    </svg>
    <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M12.5 9.5a5.5 5.5 0 0 1-6-7.9c-2.7.7-4.7 3.1-4.7 6 0 3.4 2.8 6.2 6.2 6.2 2.9 0 5.3-2 6-4.7-.5.2-1 .4-1.5.4z" fill="currentColor"></path>
    </svg>
  </button>
</nav>
{{end}}
