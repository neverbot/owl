# Quickstart for trying owl from a fresh clone of the repository.
#
#   docker compose up
#
# Then visit http://localhost:9090. By default this pulls the image
# published to GitHub Container Registry. To rebuild from your local
# checkout instead, run:
#
#   docker compose up --build
#
# The example config keeps a short retention window and writes the
# SQLite database into a named volume, so removing the volume
# (`docker compose down -v`) gives you a clean slate.

services:
  owl:
    image: ghcr.io/neverbot/owl:latest
    build:
      context: .
    container_name: owl
    ports:
      - "9090:9090"
    volumes:
      - ./examples/config.yml:/etc/owl/config.yml:ro
      - ./dashboards:/etc/owl/dashboards:ro
      - owl-data:/data
      # Bind-mount the host's /proc and /sys read-only so the host
      # collector can read CPU / memory / load / disk / net stats
      # without needing a separate exporter container.
      #
      # On Linux these are the real host's files. On Docker Desktop
      # (macOS / Windows) the "host" is the Linux VM that Docker
      # Desktop runs internally, so what you see in dev is the VM's
      # state, not the OS's. See the readme for the full caveat.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Docker socket: read-only is enough for the metrics collector
      # and the label-based discovery. Granting write would let any
      # process in the container manipulate the daemon — not what we
      # want.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The Docker socket on Docker Desktop is owned by root:root (mode
    # 0660). owl runs as the distroless `nonroot` user (UID 65532), so
    # it needs the root group in its supplementary set to read the
    # socket. On Linux production hosts the socket is typically
    # root:docker; replace "0" with your host's docker group GID
    # (often 999 on Debian/Ubuntu — check with `stat -c '%g'
    # /var/run/docker.sock`).
    group_add:
      - "0"
    command: ["--config", "/etc/owl/config.yml"]
    restart: unless-stopped

volumes:
  owl-data:
