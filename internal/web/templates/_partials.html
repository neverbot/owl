{{/*
  Shared template partials for the runtime UI. Defined once here and
  invoked via `{{template "name"}}` from index/dashboard/targets/notfound
  so the favicon list and brand mark stay in lock-step across pages.
*/}}

{{define "favicons"}}
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
{{end}}

{{define "owl-mark"}}
<svg class="topbar__mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M7 9 L7 6 L11 9"/>
  <path d="M25 9 L25 6 L21 9"/>
  <circle cx="11" cy="16" r="5"/>
  <circle cx="21" cy="16" r="5"/>
  <circle cx="11" cy="16" r="1.4" fill="currentColor" stroke="none"/>
  <circle cx="21" cy="16" r="1.4" fill="currentColor" stroke="none"/>
  <path d="M16 20.5 L14.2 24 L17.8 24 Z" fill="currentColor" stroke="none"/>
</svg>
{{end}}
