<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — owl</title>
  <script>(function(){try{var t=localStorage.getItem('owl-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <link rel="stylesheet" href="/static/owl.css">
</head>
<body>
  <div class="shell">
    <nav class="topbar">
      <a class="topbar__brand" href="/">owl</a>
      <div class="topbar__crumbs">
        <a href="/">dashboards</a>
        <span class="sep">/</span>
        <span class="current">{{.Title}}</span>
      </div>
      <label class="range-picker" aria-label="Time window">
        <select data-range>
          <option value="5m">5 min</option>
          <option value="15m">15 min</option>
          <option value="1h">1 hour</option>
          <option value="6h">6 hours</option>
          <option value="24h">24 hours</option>
        </select>
      </label>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle colour theme" type="button">
        <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.25"></circle>
          <g stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
            <line x1="8" y1="1.5" x2="8" y2="3"></line>
            <line x1="8" y1="13" x2="8" y2="14.5"></line>
            <line x1="1.5" y1="8" x2="3" y2="8"></line>
            <line x1="13" y1="8" x2="14.5" y2="8"></line>
            <line x1="3.3" y1="3.3" x2="4.4" y2="4.4"></line>
            <line x1="11.6" y1="11.6" x2="12.7" y2="12.7"></line>
            <line x1="3.3" y1="12.7" x2="4.4" y2="11.6"></line>
            <line x1="11.6" y1="4.4" x2="12.7" y2="3.3"></line>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M12.5 9.5a5.5 5.5 0 0 1-6-7.9c-2.7.7-4.7 3.1-4.7 6 0 3.4 2.8 6.2 6.2 6.2 2.9 0 5.3-2 6-4.7-.5.2-1 .4-1.5.4z" fill="currentColor"></path>
        </svg>
      </button>
    </nav>

    <h1 class="page-title">{{.Title}}</h1>

    <section class="panel-grid">
      {{range .Panels}}
      <article
        class="panel{{if eq .Status "unsupported"}} panel--unsupported{{end}}"
        data-panel-id="{{.ID}}"
        data-expr="{{.Expr}}"
        data-legend="{{.Legend}}"
        data-refresh="{{$.RefreshMS}}"
        data-unit="{{.Unit}}"
        data-status="{{.Status}}"
        data-reason="{{.Reason}}"
        style="grid-column:{{.ColStart}}/span {{.ColSpan}};grid-row:{{.RowStart}}/span {{.RowSpan}}">
        <header class="panel__header">
          <h2 class="panel__title">{{.Title}}</h2>
          {{if .Unit}}<span class="panel__unit">{{.Unit}}</span>{{end}}
        </header>
        {{if eq .Status "unsupported"}}
        <p class="panel__notice"><strong>Unsupported query.</strong> {{.Reason}}</p>
        {{else}}
        <svg class="panel__chart" aria-label="{{.Title}} chart"></svg>
        <footer class="panel__footer">
          <span class="panel__value panel__value--placeholder">—</span>
          <div class="panel__legend"></div>
        </footer>
        {{end}}
      </article>
      {{end}}
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
