name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Pages publishing needs these workflow-level permissions; they are
# scoped down to the publish-docs job that actually uses them.
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Docs check
        run: make docs-check

      - name: Docs build (smoke)
        run: make docs

  publish-image:
    name: Build and publish container image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is required so `git describe --tags` resolves
          # to a meaningful version inside the build context.
          fetch-depth: 0

      - name: Resolve build version
        id: version
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Single rolling tag: master pushes become :latest. Git tags
          # mark milestones in source control but do not produce
          # separate images. Untagged versions accrue at one per
          # push — see the "Delete untagged versions" step below.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=owl
            org.opencontainers.image.description=Tiny, lightweight self-hosted observability
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # NB: previous master builds become untagged versions in GHCR.
      # That is intentional — operators tracking :latest who hit a
      # regression can still pin to any past digest for rollback,
      # even if no human-friendly tag points at it anymore.

  publish-docs:
    name: Build and deploy docs site
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages publishing is single-flight: only one deployment proceeds
    # at a time, with newer pushes cancelling pending older ones.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build docs with subdirectory base URL
        # The site is served at https://neverbot.github.io/owl/ so
        # every site-internal absolute path has to be prefixed with
        # /owl. The generator threads --base-url through templates,
        # the chart partial, the markdown rewriter and the search
        # index, so a single flag is all it needs.
        run: go run ./cmd/owl-docs --in docs/site/content --out docs/site/dist --base-url /owl

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
