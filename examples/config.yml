# Example config for the docker compose quickstart.
#
# Listens on all interfaces because the binary runs inside a container.
# The compose file maps host port 9090 to the container.

listen: "0.0.0.0:9090"

storage:
  path: "/data/owl.db"
  retention:
    time: 1h
    size: 0

scrape:
  default_interval: 5s
  default_timeout: 2s

# Optional explicit scrape targets. Containers with owl.scrape labels
# are discovered automatically (see docker.discovery below), so this
# list usually stays short.
targets:
  - name: owl-self
    url: "http://127.0.0.1:9090/metrics"
    labels:
      job: owl

# Docker integration. Both features share one socket connection;
# enable each one independently.
docker:
  enabled: true
  socket_path: "/var/run/docker.sock"
  metrics:
    enabled: true
    interval: 10s
  discovery:
    enabled: true
    label_prefix: "owl.scrape"
    interval: 30s

# Linux host collector: reads /proc bind-mounted into the container.
# On Docker Desktop (macOS / Windows) this surfaces the underlying
# Linux VM's metrics, not the host OS — see the readme.
host:
  enabled: true
  proc_path: "/host/proc"
  sys_path: "/host/sys"
  interval: 5s

dashboards:
  dir: "/etc/owl/dashboards"

# Threshold-based alerting. The webhook URL is usually injected via
# the OWL_ALERT_WEBHOOK_URL env var so it stays out of YAML. Each rule
# fans out across every series its expression returns, so a rule like
# `container_memory_usage_bytes > 1e9` fires once per offending
# container, identified by its labels.
#
# alerts:
#   webhook_url: ""
#   rules:
#     - name: high_container_memory
#       expr: "container_memory_usage_bytes"
#       op: ">"
#       threshold: 1073741824   # 1 GiB
#       for: 2m
#     - name: low_disk
#       expr: "node_filesystem_avail_bytes"
#       op: "<"
#       threshold: 1073741824
#       for: 5m
