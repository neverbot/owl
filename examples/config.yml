# Example config for the docker compose quickstart.
#
# Listens on all interfaces because the binary runs inside a container.
# The compose file maps host port 9090 to the container.

listen: "0.0.0.0:9090"

storage:
  path: "/data/owl.db"
  retention:
    time: 1h
    size: 0

scrape:
  default_interval: 5s
  default_timeout: 2s

# Docker integration. Both features share one socket connection;
# enable each one independently.
docker:
  enabled: true
  socket_path: "/var/run/docker.sock"
  metrics:
    enabled: true
    interval: 10s
  discovery:
    enabled: true
    label_prefix: "owl.scrape"
    interval: 30s

# Linux host collector: reads /proc bind-mounted into the container.
# On Docker Desktop (macOS / Windows) this surfaces the underlying
# Linux VM's metrics, not the host OS — see the readme.
host:
  enabled: true
  proc_path: "/host/proc"
  sys_path: "/host/sys"
  interval: 5s

dashboards:
  dir: "/etc/owl/dashboards"
